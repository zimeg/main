# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Share a file to a Slack channel
on:
  push:
jobs:
  run:
    name: Share a file to a Slack channel
    runs-on: ubuntu-latest
    steps:
      - name: Generate a changelog
        run: |
          cat <<EOF > CHANGELOG.md
          ## v2.4.0 - 2026-05-05

          ### Added
          - Support for file uploads in notifications
          - Improved error handling for webhook deliveries

          ### Fixed
          - Resolved timeout issues with large payloads
          EOF

      - name: Share a file to that channel
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            initial_comment: "the results are in!"
            file: "./CHANGELOG.md"
            filename: "CHANGELOG-${{ github.sha }}.md"
